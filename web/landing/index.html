<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifier — Trust &amp; Verification Tooling</title>
  <meta name="description" content="Verifier — trust and verification tooling for the Innotel platform portfolio.">
  <meta property="og:title" content="Verifier — Trust &amp; Verification Tooling">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2334d399'/%3E%3Cpath fill='%230b0d10' d='M14 32l12 12 24-24-6-6-18 18-6-6z'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --surface: #181c22;
      --border: #262c35;
      --text: #f4f7fb;
      --text-muted: #a8b2bf;
      --accent: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { max-width: 720px; margin: 0 auto; padding: 96px 24px 64px; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--accent); color: var(--bg); font-size: 26px; font-weight: 700;
    }
    h1 { font-size: 40px; margin: 28px 0 8px; letter-spacing: -0.02em; }
    p.sub { color: var(--text-muted); font-size: 18px; margin: 0 0 40px; }
    .links { display: flex; gap: 16px; flex-wrap: wrap; }
    .links a {
      display: inline-block; padding: 10px 18px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); font-weight: 500;
    }
    .links a:hover { border-color: var(--accent); text-decoration: none; }
    footer { color: var(--text-muted); margin-top: 72px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">✓</div>
    <h1>Verifier</h1>
    <p class="sub">Trust &amp; verification tooling for the Innotel platform portfolio.</p>
    <div class="links">
      <a href="https://github.com/innotelinc/verifier">Source code</a>
      <a href="https://github.com/innotelinc/verifier/tree/main/docs">Documentation</a>
    </div>
    <footer>Part of the Innotel platform stack.</footer>
  </main>
</body>
</html>
